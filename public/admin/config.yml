# Decap CMS configuration for GPODH.
#
# Auth: GitHub backend via a self-hosted OAuth handshake (see src/app/api/auth
# and src/app/api/callback). You will need a GitHub OAuth App and two env vars
# in Vercel: GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET.
#
# IMPORTANT: set base_url to your canonical production origin (the same domain
# you open /admin on). Update the GitHub OAuth App callback URL to match
# <base_url>/api/callback.

backend:
  name: github
  repo: samwoodhouse1982/gpodh
  branch: master
  base_url: https://g-po-dh.vercel.app
  auth_endpoint: api/auth

# Episode guest photos upload into public/guests and are referenced as /guests/<file>.
media_folder: public/guests
public_folder: /guests

# Review before publishing: saving creates a draft pull request you approve
# (Workflow tab) before it goes live.
publish_mode: editorial_workflow

collections:
  - name: content
    label: Content
    files:
      - name: settings
        label: Site settings
        file: src/data/site/settings.json
        format: json
        description: >-
          Global site details, podcast platform links, social links and the
          consulting call-to-action used across the site.
        fields:
          - name: site
            label: Site details
            widget: object
            fields:
              - { name: name, label: Site name, widget: string }
              - { name: shortName, label: Short name, widget: string }
              - { name: description, label: Description (SEO), widget: text }
              - { name: url, label: Site URL, widget: string }
              - { name: email, label: Contact email, widget: string }
          - name: consulting
            label: Consulting call-to-action
            widget: object
            fields:
              - { name: ctaText, label: Heading, widget: string }
              - { name: ctaLinkText, label: Link text, widget: string }
              - { name: url, label: Link destination, widget: string }
              - { name: description, label: Description, widget: text }
          - name: platforms
            label: Podcast platforms
            widget: object
            fields:
              - { name: apple, label: Apple Podcasts URL, widget: string }
              - { name: spotify, label: Spotify URL, widget: string }
              - { name: youtube, label: YouTube URL, widget: string }
          - name: social
            label: Social links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn (personal) URL, widget: string }
              - { name: linkedinCompany, label: LinkedIn (company) URL, widget: string }
              - { name: substack, label: Substack URL, widget: string }

      - name: episodes
        label: Episodes
        file: src/data/episodes.json
        format: json
        description: >-
          The podcast episode library. Add a new episode with "Add episodes",
          then drag it to the top of the list so it appears first. Tick
          "Featured" to pin it as the homepage banner.
        fields:
          - name: episodes
            label: Episodes
            label_singular: Episode
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin as homepage banner)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string, hint: 'e.g. my-episode-title — becomes /episodes/my-episode-title' }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: episodeNumber, label: Episode number, widget: number, required: false, value_type: int }
              - { name: guest, label: Guest, widget: string }
              - { name: guestRole, label: Guest role, widget: string }
              - { name: date, label: 'Date (e.g. Apr 2026)', widget: string }
              - { name: duration, label: 'Duration (e.g. 1hr 8min)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: url, label: 'Canonical URL', widget: string }
              - { name: artworkUrl, label: Guest photo, widget: image, required: false, choose_url: true }
              - { name: country, label: Country, widget: string }
              - name: themes
                label: Themes
                widget: list
                field: { name: theme, label: Theme, widget: string }
              - name: tags
                label: Tags
                widget: list
                field: { name: tag, label: Tag, widget: string }
              - { name: pullQuote, label: Pull quote, widget: text, required: false }
              - { name: bio, label: Guest bio, widget: text, required: false }
              - name: topics
                label: Key topics
                widget: list
                required: false
                field: { name: topic, label: Topic, widget: text }
              - name: timestamps
                label: Timestamps
                widget: list
                required: false
                fields:
                  - { name: time, label: Time, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: transistorUrl, label: 'Transistor share URL', widget: string, required: false }
              - { name: spotifyEpisodeId, label: 'Spotify episode ID', widget: string, required: false }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string, required: false }
              - { name: audioUrl, label: 'MP3 URL', widget: string, required: false }
              - { name: teaserVideoUrl, label: 'Teaser video URL', widget: string, required: false }
              - { name: guestLinkedIn, label: 'Guest LinkedIn URL', widget: string, required: false }

      - name: videos
        label: Videos
        file: src/data/videos.json
        format: json
        description: >-
          The video library. New uploads are added automatically by the daily
          sync as a pull request — use this to add the category and tags, paste
          a transcript (which feeds search), or add a video by hand. Drag an
          entry to the top to feature it, or tick "Featured".
        fields:
          - name: videos
            label: Videos
            label_singular: Video
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin to top of /videos)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string }
              - { name: date, label: 'Date (e.g. Mar 2026)', widget: string }
              - name: category
                label: Category
                widget: select
                required: false
                options: ['talk', 'panel', 'explainer', 'clip']
              - { name: duration, label: 'Duration (e.g. 12:34)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - name: tags
                label: Tags
                widget: list
                required: false
                field: { name: tag, label: Tag, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: thumbnailUrl, label: 'Thumbnail override (optional)', widget: image, required: false, choose_url: true }
              - { name: thumbnailPosition, label: 'Thumbnail position (e.g. center 20%)', widget: string, required: false }
