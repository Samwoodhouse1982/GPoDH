# Decap CMS configuration for GPODH.
#
# Auth: GitHub backend via a self-hosted OAuth handshake (see src/app/api/auth
# and src/app/api/callback). You will need a GitHub OAuth App and two env vars
# in Vercel: GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET.
#
# IMPORTANT: set base_url to your canonical production origin (the same domain
# you open /admin on). Update the GitHub OAuth App callback URL to match
# <base_url>/api/callback.

backend:
  name: github
  repo: samwoodhouse1982/gpodh
  branch: master
  base_url: https://g-po-dh.vercel.app
  auth_endpoint: api/auth

# Episode guest photos upload into public/guests and are referenced as /guests/<file>.
media_folder: public/guests
public_folder: /guests

# Review before publishing: saving creates a draft pull request you approve
# (Workflow tab) before it goes live.
publish_mode: editorial_workflow

collections:
  - name: content
    label: Content
    files:
      - name: settings
        label: Site settings
        file: src/data/site/settings.json
        format: json
        description: >-
          Global site details, podcast platform links, social links and the
          consulting call-to-action used across the site.
        fields:
          - name: site
            label: Site details
            widget: object
            fields:
              - { name: name, label: Site name, widget: string }
              - { name: shortName, label: Short name, widget: string }
              - { name: description, label: Description (SEO), widget: text }
              - { name: url, label: Site URL, widget: string }
              - { name: email, label: Contact email, widget: string }
          - name: consulting
            label: Consulting call-to-action
            widget: object
            fields:
              - { name: ctaText, label: Heading, widget: string }
              - { name: ctaLinkText, label: Link text, widget: string }
              - { name: url, label: Link destination, widget: string }
              - { name: description, label: Description, widget: text }
          - name: platforms
            label: Podcast platforms
            widget: object
            fields:
              - { name: apple, label: Apple Podcasts URL, widget: string }
              - { name: spotify, label: Spotify URL, widget: string }
              - { name: youtube, label: YouTube URL, widget: string }
          - name: social
            label: Social links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn (personal) URL, widget: string }
              - { name: linkedinCompany, label: LinkedIn (company) URL, widget: string }
              - { name: substack, label: Substack URL, widget: string }

      - name: episodes
        label: Episodes
        file: src/data/episodes.json
        format: json
        description: >-
          The podcast episode library. Add a new episode with "Add episodes",
          then drag it to the top of the list so it appears first. Tick
          "Featured" to pin it as the homepage banner.
        fields:
          - name: episodes
            label: Episodes
            label_singular: Episode
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin as homepage banner)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string, hint: 'e.g. my-episode-title — becomes /episodes/my-episode-title' }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: episodeNumber, label: Episode number, widget: number, required: false, value_type: int }
              - { name: guest, label: Guest, widget: string }
              - { name: guestRole, label: Guest role, widget: string }
              - { name: date, label: 'Date (e.g. Apr 2026)', widget: string }
              - { name: duration, label: 'Duration (e.g. 1hr 8min)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: url, label: 'Canonical URL', widget: string }
              - { name: artworkUrl, label: Guest photo, widget: image, required: false, choose_url: true }
              - { name: country, label: Country, widget: string }
              - name: themes
                label: Themes
                widget: list
                field: { name: theme, label: Theme, widget: string }
              - name: tags
                label: Tags
                widget: list
                field: { name: tag, label: Tag, widget: string }
              - { name: pullQuote, label: Pull quote, widget: text, required: false }
              - { name: bio, label: Guest bio, widget: text, required: false }
              - name: topics
                label: Key topics
                widget: list
                required: false
                field: { name: topic, label: Topic, widget: text }
              - name: timestamps
                label: Timestamps
                widget: list
                required: false
                fields:
                  - { name: time, label: Time, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: transistorUrl, label: 'Transistor share URL', widget: string, required: false }
              - { name: spotifyEpisodeId, label: 'Spotify episode ID', widget: string, required: false }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string, required: false }
              - { name: audioUrl, label: 'MP3 URL', widget: string, required: false }
              - { name: teaserVideoUrl, label: 'Teaser video URL', widget: string, required: false }
              - { name: guestLinkedIn, label: 'Guest LinkedIn URL', widget: string, required: false }

      - name: videos
        label: Videos
        file: src/data/videos.json
        format: json
        description: >-
          The video library. New uploads are added automatically by the daily
          sync as a pull request — use this to add the category and tags, paste
          a transcript (which feeds search), or add a video by hand. Drag an
          entry to the top to feature it, or tick "Featured".
        fields:
          - name: videos
            label: Videos
            label_singular: Video
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin to top of /videos)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string }
              - { name: date, label: 'Date (e.g. Mar 2026)', widget: string }
              - name: category
                label: Category
                widget: select
                required: false
                options: ['talk', 'panel', 'explainer', 'clip']
              - { name: duration, label: 'Duration (e.g. 12:34)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - name: tags
                label: Tags
                widget: list
                required: false
                field: { name: tag, label: Tag, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: thumbnailUrl, label: 'Thumbnail override (optional)', widget: image, required: false, choose_url: true }
              - { name: thumbnailPosition, label: 'Thumbnail position (e.g. center 20%)', widget: string, required: false }

      - name: contact
        label: Contact page
        file: src/data/site/contact.json
        format: json
        description: All text on the Contact page.
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: title, label: Title, widget: string }
          - name: success
            label: Success message (after sending)
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: form
            label: Form labels
            widget: object
            fields:
              - { name: nameLabel, label: Name label, widget: string }
              - { name: emailLabel, label: Email label, widget: string }
              - { name: organisationLabel, label: Organisation label, widget: string }
              - { name: messageLabel, label: Message label, widget: string }
              - { name: messagePlaceholder, label: Message placeholder, widget: string }
              - { name: submitLabel, label: Submit button, widget: string }
              - { name: submittingLabel, label: Submitting button, widget: string }
          - name: responseTime
            label: Response-time block
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: note, label: Note, widget: string }
          - { name: listenHeading, label: '"Listen on" heading', widget: string }
          - { name: followHeading, label: '"Follow" heading', widget: string }
          - name: followLinks
            label: Follow link labels
            widget: object
            fields:
              - { name: linkedinPersonal, label: LinkedIn (personal) label, widget: string }
              - { name: linkedinCompany, label: LinkedIn (company) label, widget: string }
              - { name: substack, label: Substack label, widget: string }
          - name: consulting
            label: Consulting block
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: linkText, label: Link text, widget: string }
              - { name: linkUrl, label: Link URL, widget: string }

      - name: work-with-us
        label: Work With Us page
        file: src/data/site/work-with-us.json
        format: json
        description: >-
          All text on the Work With Us page — the podcast partnerships section
          and the consulting section. Body fields support basic formatting
          (bold, italic, links).
        fields:
          - name: partnerships
            label: Podcast partnerships section
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Intro paragraph, widget: markdown }
              - name: stats
                label: Audience stats
                widget: list
                max: 2
                fields:
                  - { name: value, label: 'Value (e.g. 60+)', widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: audienceLabel, label: '"Core audience" label', widget: string }
              - name: audienceTypes
                label: Audience type pills
                widget: list
                field: { name: type, label: Type, widget: string }
              - name: primaryCta
                label: Primary call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }
                  - { name: note, label: Note under button, widget: string }
              - { name: optionsHeading, label: '"How to get involved" heading', widget: string }
              - name: optionGroups
                label: Option groups
                widget: list
                summary: '{{fields.group}}'
                fields:
                  - { name: group, label: Group heading, widget: string }
                  - name: options
                    label: Options
                    widget: list
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: description, label: Description, widget: markdown }
              - { name: closingBody, label: Closing paragraph, widget: markdown }
              - name: closingCta
                label: Closing call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }
          - name: photos
            label: Photo strip
            widget: list
            max: 2
            fields:
              - { name: src, label: Image, widget: image, choose_url: true }
              - { name: alt, label: Alt text, widget: string }
              - { name: position, label: 'Focus point (e.g. center 25%)', widget: string }
          - { name: consultingLabel, label: Consulting divider label, widget: string }
          - name: consulting
            label: Consulting section
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: markdown }
              - { name: whoLabel, label: '"Who Shubs works with" label', widget: string }
              - name: who
                label: Who Shubs works with
                widget: list
                field: { name: item, label: Item, widget: string }
              - { name: trustNote, label: Trust note, widget: string }
              - name: cta
                label: Call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }
