name: Sync YouTube videos

# Checks the GPODH YouTube channel for new uploads and, when it finds videos
# not yet listed in src/data/videos.json, commits them straight to master so
# they go live automatically. Set the category/tags afterwards in the CMS.

on:
  schedule:
    - cron: '0 7 * * *' # daily at 07:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync videos from YouTube
        id: sync
        run: node scripts/sync-videos.mjs

      - name: Commit new videos to master
        if: steps.sync.outputs.added && steps.sync.outputs.added != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/videos.json
          git commit -m 'Add new YouTube video(s) to the library'
          git push origin HEAD:master
