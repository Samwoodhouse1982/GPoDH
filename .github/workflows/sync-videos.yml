name: Sync YouTube videos

# Checks the GPODH YouTube channel for new uploads and, when it finds videos
# not yet listed in src/data/videos.json, opens a pull request adding them so
# you can set the category/tags and merge to publish.

on:
  schedule:
    - cron: '0 7 * * *' # daily at 07:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync videos from YouTube
        id: sync
        run: node scripts/sync-videos.mjs

      - name: Open pull request
        if: steps.sync.outputs.added && steps.sync.outputs.added != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/new-videos
          base: master
          commit-message: 'Add new YouTube video(s) to the library'
          title: 'New YouTube video(s) to review'
          body: |
            The channel published video(s) not yet on the site. This PR adds them
            to `src/data/videos.json` with the title, description and date pulled
            from YouTube.

            Before merging, please set the **category** (`talk` / `panel` /
            `explainer` / `clip`) and **tags** for each new entry, and tidy the
            description if needed.

            New in this PR:
            ${{ steps.sync.outputs.summary }}
          labels: content, automated
          delete-branch: true
